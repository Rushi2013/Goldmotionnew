# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Default version metadata. CI overrides these with -P flags (see .github/workflows/android.yml)
VERSION_CODE=1
VERSION_NAME=1.0.0

# Release signing is supplied either by
#   1) CI secrets  -> ORG_GRADLE_PROJECT_JARVIS_STORE_FILE_BASE64 / _PASSWORD / ...
#   2) local ~/.gradle/gradle.properties -> JARVIS_STORE_FILE=/abs/path/keystore.jks ...
# If neither exists, the release build falls back to the debug keystore so that
# `assembleRelease` always produces an installable APK (never a broken workflow).
