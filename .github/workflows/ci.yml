name: CI (tests + lint)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace > test.log 2>&1
          CODE=$?
          echo "exit=$CODE"
          {
            echo "### Unit tests exit=$CODE"
            echo '#### Compiler / test errors'
            echo '```'
            grep -E "^e: |FAILED|AssertionError|expected|Exception|error:" test.log | head -80
            echo '```'
            echo '#### Failing test names (from JUnit XML)'
            echo '```'
            for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
              [ -f "$f" ] || continue
              grep -oE '<testcase name="[^"]*" classname="[^"]*"' "$f" | sed 's/<testcase name="/  /; s/" classname="/  @ /; s/"$//' > /tmp/all_tests.txt || true
              python3 -c "
import sys, xml.etree.ElementTree as ET
r = ET.parse('$f').getroot()
print('file: $f  tests=%s failures=%s errors=%s' % (r.get('tests'), r.get('failures'), r.get('errors')))
for tc in r.iter('testcase'):
    for tag in ('failure', 'error'):
        n = tc.find(tag)
        if n is not None:
            print('  FAIL', tc.get('classname'), '::', tc.get('name'))
            msg = (n.get('message') or '').strip()
            if msg: print('       msg:', msg[:400])
            body = (n.text or '').strip()
            if body: print('       at :', body.split(chr(10))[0][:300])
" 2>/dev/null || sed -n '1,40p' "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
