name: CI (tests + lint)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}

      - name: Run unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace > test.log 2>&1
          CODE=$?
          echo "exit=$CODE"
          {
            echo "### Unit tests exit=$CODE"
            echo '#### Errors'
            echo '```'
            grep -E '^e: |FAILED|AssertionError|expected|Exception|error:' test.log | head -80
            echo '```'
            echo '#### JUnit results'
            echo '```'
            python3 .github/scripts/junit_summary.py app/build/test-results/testDebugUnitTest || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
